<script>
/* ===== ATLAS SCEN =====
   Lokalizacja: rozdział + numer strony druku Pini 1934 w nawiasach [465] (tak, jak na Wikiźródłach).
   fakt = co jest w tekście; znaczenie / alts / pro / con = interpretacja (I) do sprawdzenia. */
const WORKS = {
  T: {name:"Tajemnica lorda Singelworth", short:"Tajemnica…", src:"Wikiźródła, Dzieła Cyprjana Norwida, wyd. Pini 1934, s. 465–472"},
  B: {name:"Bransoletka", short:"Bransoletka", src:"Wikiźródła, Dzieła Cyprjana Norwida, wyd. Pini 1934, s. 450–453"},
  L: {name:"Ad leones!", short:"Ad leones!", src:"Wikiźródła, Dzieła Cyprjana Norwida, wyd. Pini 1934, s. 473–478"}
};

const SCENES = [
/* ---------- TAJEMNICA LORDA SINGELWORTH ---------- */
{id:"ST1", w:"T", loc:"rozdz. I, [465] — początek", title:"Pytania zamiast opowieści",
 quote:"Czy rzeczywiście były jakie ziemie Singelworth, we ważności baronji nadane przodkowi w linji prostej męża, o którym to moje spomnienie zapisuję?",
 fakt:"Nowela zaczyna się od serii pytań o pochodzenie Singelworthów: czy mieli tytuł, ziemie, studia w Oksfordzie, miejsce w parlamencie, czy byli raczej właścicielami rękodzielni wyrabiającej perkaliki. Narrator mówi, że odpowiedź wymagałaby „romansopisarza”, a on pisze nowelę o „spostrzeżeniu psychologicznym”. Zapewnia tylko, że w wielkich hotelach Europy i Wschodu mówiło się „lord Singelworth”, zanim ktoś go zobaczył.",
 narr:"Narrator pisze wspomnienie („moje spomnienie zapisuję”), a więc opowiada z odległości czasu. Nie podaje żadnej wiedzy o rodzie lorda. Zamiast tego pokazuje, jak „lord” zyskał tytuł: przez powtarzanie.",
 means:"Seria pytań retorycznych; ironiczny katalog możliwych biografii (od parlamentu po perkaliki); metakomentarz o gatunku (romans a nowela).",
 znaczenie:"Już pierwszy akapit przenosi uwagę z pytania „kim jest lord?” na pytanie „skąd wiemy, że jest lordem?”. Tytuł obiecuje zagadkę, a tekst od razu odmawia jej typowego rozwiązania.",
 alts:[
  {l:"Odczytanie gatunkowe", t:"Narrator wyznacza granicę między powieścią tajemnic a nowelą psychologiczną i wyjaśnia, dlaczego nie da klasycznej zagadki (por. Rzepczyński, który wiąże tytuł z konwencją „tajemnic” w literaturze XIX w.)."},
  {l:"Odczytanie o tożsamości i autorytecie", t:"Tytuł lorda opiera się na opinii otoczenia, nie na dowodach. To zapowiada temat osądzania i fabrykowania pozorów."}],
 pro:"Pytania nie dostają odpowiedzi w całej noweli; tytuł funkcjonuje jako „fakt społeczny”.",
 con:"Narrator nie podważa istnienia lorda; kwestionuje tylko jego genealogię. Nie wolno z tego robić tezy, że lord „nie istnieje”.",
 q:"Co się zmienia w odbiorze, gdy narrator zamiast opisać lorda, zadaje pytania o jego tytuł? Jaką wiedzę o bohaterze otrzymasz od razu, a jakiej nie dostaniesz do końca?",
 tags:["P2","P3","P5"], th:["T1","T3"]},

{id:"ST2", w:"T", loc:"rozdz. I, [465]", title:"Przybycie do hotelu pod Białym Lwem",
 quote:"nie jak się gdzie przybywa, lecz jak się wraca.",
 fakt:"W Wenecji, w hotelu pod białym lwem, najpierw czeka aeronauta z przyborami i majordomo. Aeronautę wysyła się na Lido, skąd można puszczać balon. Lord przypływa osobną gondolą, wychodzi na kamień progu i wchodzi „obojętnie”, jakby wracał. Narrator dodaje, że codzienne używanie balonu o tej samej godzinie „dawałoby pole do domniemywania”.",
 narr:"Relacja zewnętrzna, oparta na obserwacji ceremonii. Narrator nie ma dostępu do myśli lorda.",
 means:"Zderzenie rytuału i obojętności; kontrast między rozbudowanym przygotowaniem (majordomo, aeronauta) a spokojem bohatera; powtarzalność („codziennie o tej samej godzinie”).",
 znaczenie:"Lord wchodzi do świata jako gotowy, wcześniej zapowiedziany wizerunek, a nie jako osoba z historią. Regularność jego lotów sama prowokuje domysły.",
 alts:[
  {l:"Teatralność", t:"Ceremonia przypomina wejście na scenę: widownia (hotel) jest uprzedzona, aktor się nie spieszy. [I]"},
  {l:"Maska", t:"Wygląda na to, że lord ma stałą rolę (por. Dambek-Giallelis o lordzie jako „personie”, nie osobie, hipoteza autorki)."}],
 pro:"Wszystko jest przygotowane przed jego przybyciem: opinia wyprzedza osobę.",
 con:"To tylko jeden obraz; samo spokojne zachowanie nie dowodzi „odgrywania roli”.",
 q:"Wypisz, co zostało przygotowane przed przybyciem lorda i kto to zrobił. Czego o nim samym dowiadujesz się z tej sceny?",
 tags:["P1","P2"], th:["T3","T7"]},

{id:"ST3", w:"T", loc:"rozdz. I, [465]", title:"Wieże, kopuły i „drzwi twarde zamkniętej tajemnicy”",
 quote:"Pociski te jednakże obijały się ostatecznie o drzwi twarde zamkniętej tajemnicy.",
 fakt:"Gdziekolwiek lord bawi (Kair, Konstantynopol, Moskwa, Wiedeń, Paryż), jego loty komentuje się „stosownie do zgadobliwości miejscowego umysłu i pochopów humoru”: opowiada się, głosi, zaprzecza i „uręcza”. Domysły, dowcipy i anegdoty „obijają się” o zamkniętą tajemnicę.",
 narr:"Narrator wszechwiedzący w skali świata (wie, co mówią w kilku miastach), a jednocześnie nie zna odpowiedzi. To rzadkie połączenie.",
 means:"Katalog czasowników mówienia (opowiadano, głoszono, zaprzeczano, uręczano); metafora „pocisków”; neologizm „zgadobliwość”.",
 znaczenie:"Słowo „zgadobliwość” (użyte w noweli raz) to klucz ironiczny: opisuje skłonność umysłu do zgadywania i szybkiego przekształcania domysłu w pewnik. Rzepczyński uznaje je za ironiczną diagnozę przeciętnego poziomu myślenia XIX w.",
 alts:[
  {l:"Krytyka „zgadobliwego” umysłu (Rzepczyński [T])", t:"Ostrze ironii nie uderza w samo zgadywanie (to funkcja umysłu), tylko w użytek, jaki się z niego robi."},
  {l:"Neutralna obserwacja", t:"Zdanie tylko stwierdza, że ludzie reagują różnie, bez wartościowania. [I] — słabiej uzasadnione przez „pochopy humoru”."}],
 pro:"Wszystkie wersje pochodzą od otoczenia; lord nie wypowiada się w pierwszej części.",
 con:"„Zgadobliwość” pojawia się tylko raz. Nie wolno budować na niej całej interpretacji bez innych fragmentów.",
 q:"Jak brzmi zdanie z „zgadobliwością” w całości? Wskaż w nim wyrazy, które oceniają, i takie, które tylko relacjonują.",
 tags:["P2","P3","P5"], th:["T1","T6"]},

{id:"ST4", w:"T", loc:"rozdz. I, [465]–[466]", title:"Plotka w mieście pod obcym rządem",
 quote:"przemilczenia, niedopowiedzenia, mgnienia powieki, chrząchnięcia i kichnięcia!...",
 fakt:"Narrator mówi, że w Wenecji plotek było więcej niż gdzie indziej, bo „despotyzm rządu obcego” ma nierozłączną od siebie ostrożność. Im bardziej ograniczona jawna wolność wypowiedzi, tym większą siłę mają niedopowiedzenia, mgnienia powieki, chrząchnięcia i kichnięcia.",
 narr:"Komentarz ogólny narratora, w stylu uogólnienia (sentencja). Wyraźnie ocenia sytuację polityczną.",
 means:"Hiperbola („piorunnej siły”); wyliczenie drobnych gestów; paradoks (milczenie głośniejsze od słów).",
 znaczenie:"To najważniejsze miejsce dla związku Wenecji z poetyką noweli: cenzura i nadzór sprawiają, że sens przenosi się z mowy na gest. Później kichnięcie Toniego i milczenie lorda działają według tej samej zasady.",
 alts:[
  {l:"Wenecja jako warunek zdarzeń", t:"Nowela działa dlatego, że rządzi tu strach przed otwartym słowem. W innym mieście plotka miałaby inny charakter. [I]"},
  {l:"Komentarz przykładowy", t:"Narrator ilustruje ogólną prawdę o mowie i cenzurze, a Wenecja jest tylko przykładem. [I]"}],
 pro:"Zdanie wprost łączy rząd, strach i rozrost plotek („im bywa więcej…”).",
 con:"Tekst mówi „w Wenecji więcej niż w innem jakiem mieście”, czyli nie twierdzi, że tylko tu.",
 q:"Jak brzmi rozumowanie narratora krok po kroku (od rządu do plotki)? Gdzie później w noweli pojawia się znaczący gest zamiast słowa?",
 tags:["P1","P2","P5"], th:["T7","T8"],
 mn:"Z Twoich notatek: „im większa wolność słowa, tym więcej plotek” (s. 2). Sprawdź jeszcze raz: tekst mówi, że im ściślej ogranicza się jawną wolność opinii, tym większą moc mają niedopowiedzenia. Sprawdź, czy dobrze odczytałaś kierunek zależności."},

{id:"ST5", w:"T", loc:"rozdz. I, [466]", title:"Felietonista, generał i profesor",
 quote:"Rzecz dziwna, jak uznanie masy przenosić się może łatwiej na to, co z pozoru na wiarogodność żadną nie zasługuje...",
 fakt:"Trzy wyjaśnienia: paryski felietonista (higiena osobista, potwierdzają ją „necessery” pakowane do kosza), generał Kutasow z Odessy (raport: brak zagrożenia, w koszu cenny, łamliwy sprzęt, etruska waza lub porcelana), profesor z Heidelbergu (obserwacje meteorologiczne). Felietonista ma największy rozgłos. Narrator komentuje: uznanie masy łatwo przenosi się na to, co z pozoru nie zasługuje na wiarę.",
 narr:"Narrator zestawia cudze wersje bez pewności, ale z wyraźnym komentarzem ironicznym na końcu („Rzecz dziwna…”).",
 means:"Katalog trzech autorytetów (prasa, władza, nauka); ton raportu urzędowego; sentencja o „masie”.",
 znaczenie:"Wersje pochodzą z trzech instytucji, a żadna nie ma dowodu. Zwycięża ta, która jest najbardziej rozpowszechniona. Rzepczyński pokazuje, że czytelnik rozpoznaje w każdej z postaci własną „zgadobliwość”.",
 alts:[
  {l:"Krytyka autorytetów", t:"Prasa, władza i nauka okazują się jednakowo niepewne. [I]"},
  {l:"Mechanizm popularności (Adamiec według Rzepczyńskiego)", t:"Rzepczyński cytuje Adamca, który uważa, że każdy znalazł w tajemnicy odpowiedź na pytanie, jakie był w stanie postawić. Cytat z drugiej ręki [B]; sprawdź w tekście Adamca."}],
 pro:"Żadna wersja nie ma dowodu, a mimo to narrator mówi o „rozgłosie” i „uznaniu masy”.",
 con:"Profesor z Heidelbergu proponuje hipotezę rozsądną i narrator nie drwi z niej wprost (komentuje tylko, że lepiej zachęcać niż szydzić).",
 q:"Jakiego rodzaju autorytet reprezentuje każda z trzech wersji? Dlaczego, według narratora, wygrywa ta, która „z pozoru na wiarogodność żadną nie zasługuje”?",
 tags:["P2","P3","P5"], th:["T1","T2","T12"]},

{id:"ST6", w:"T", loc:"rozdz. I, [466]–[467]", title:"Sior Toni di Bona Grazia, improwizator",
 quote:"Improwizator względem przybycia lorda Singelworth postawił się jako obrońca sławy osobistej podróżnika.",
 fakt:"Na placu św. Marka występuje improwizator Toni di Bona Grazia, „osoba historyczna”. Ma kapelusz trikorn, mówi „wargami arlekina (atoli arlekina klasycznego z czasów etruskich)”, nosi „dekoracje” z kłów wieprzowych, muszli i błyskotek. Przypis redakcyjny (P. P.) mówi, że Toni niedawno zmarł, i że nowela lepiej oddaje jego postać niż czasopisma. Austriaccy dygnitarze czasem go słuchają.",
 narr:"Narrator mówi „którą wielokrotnie słyszeć miałem przyjemność”, czyli zaświadcza o historyczności Toniego własnym doświadczeniem. W przypisie pojawia się głos spoza narracji (P. P. = Przesmycki).",
 means:"Kostium (arlekin, trikorn, „dekoracje”); opis jak wejście aktora; buffo; przypis autorski jako wyjątek w całej „trylogii włoskiej” (Dambek-Giallelis).",
 znaczenie:"Toni to nieoficjalny komentator rzeczywistości pod cenzurą. Dambek-Giallelis pokazuje jego źródła (Goldoni, komedia dell’arte, relacja Baschet) i stawia hipotezę, że to on wytwarza postać lorda w opinii Wenecjan.",
 alts:[
  {l:"Mądry błazen (Rzepczyński [T])", t:"Toni, grając „arlekina”, demaskuje współczesność; jego mowa ma podwójnego adresata: słuchających i podsłuchujących."},
  {l:"Ukryty spiritus movens (Dambek-Giallelis [T], pytanie badaczki)", t:"To on wprowadza lorda do wyobraźni Wenecjan i on komentuje jego odlot. Autorka zestawia to z tezą Dąbrowicz o „publicznym mówieniu”."}],
 pro:"Bez Toniego nie ma legendy lorda: to on obraca plotki w widowisko.",
 con:"Narrator pozostaje głównym organizatorem opowieści. Teza o „ukrytym sprawcy” jest hipotezą badaczki, nie faktem tekstowym.",
 q:"Wypisz elementy kostiumu i gestu Toniego. Które z nich są komiczne, a które mogą być sygnałem dla „podsłuchujących”?",
 tags:["P3","P4","P5"], th:["T8","T9"]},

{id:"ST7", w:"T", loc:"rozdz. I, [467]", title:"Monolog Toniego: Piombi, konie i palimpsest śmietników",
 quote:"Papier niezapisany czy jednakże podobna, ażeby tyle wysłowił?",
 fakt:"W monologu Toni najpierw dziwi się, że wciąż ktoś miałby oskarżać lorda o to, że z wysoka „splunął zgóry”. Potem przechodzi do widoków z góry: Piombi i Most Westchnień wyglądają stamtąd jak „pełzające płaskie robactwo”, ale cztery konie św. Marka mają urok. Mówi o papierze, który z balonu upadł na wyspę Murano i „miał wytłumaczyć wszystko”. Czyta „dzieje” ze śmietników jak z palimpsestów (but, guzik, karty, bukiet, kałamarz). Zamyka żartem o nosach policji. Zbiera pieniądze na chustkę. Wcześniej kicha i wyciąga jaskrawą chustkę.",
 narr:"Narrator relacjonuje cudzą mowę w całości, bez przerywania. Później, w rozdz. II, ten sam papier powraca jako temat sporu.",
 means:"Przejście od patosu do trywialności; mowa dwuznaczna; gest (kichnięcie) jako sygnał; motyw „czytania z odpadków” (palimpsest); aluzja do policji.",
 znaczenie:"Najbardziej „karnawałowy” moment noweli: błazen ośmiesza wzniosłość (wieże, konie) i podnosi śmieci do rangi tekstu. Papier niezapisany staje się znakiem pustym, który każdy może wypełnić.",
 alts:[
  {l:"Karnawałowa degradacja i odwrócenie (hipoteza [H], do sprawdzenia po lekturze Bachtina)", t:"Wzniosłe obiekty są „widziane od dołu”, a odpadki dostają rangę dokumentu. Zanim użyjesz Bachtina, sprawdź, które jego pojęcia tu naprawdę pasują."},
  {l:"Mowa Ezopowa (Dąbrowicz według Dambek-Giallelis [B])", t:"W cytacie przytoczonym przez Dambek-Giallelis Dąbrowicz pisze, że wypowiedź improwizatora jest skierowana do dwóch typów odbiorców. Sprawdź w oryginale (SN 3–4, s. 221–223)."},
  {l:"Papier jako luka", t:"Papier niezapisany nic nie wyjaśnia, a według Toniego „miał wytłumaczyć wszystko”. Znak pusty pokazuje, jak ludzie wypełniają brak wiedzy. [I]"}],
 pro:"Fragment ma wyraźną dwuwarstwowość: komedia na wierzchu, aluzja polityczna pod spodem (kichnięcie, nosy policji).",
 con:"Samo użycie śmietnika i ciała nie wystarcza, by mówić o karnawalizacji w sensie Bachtina; trzeba pokazać funkcję (odnowa? ambiwalentny śmiech?).",
 q:"Co dokładnie Toni mówi o papierze i co z tego narrator uznaje za wiadomość, a co za anegdotę? Wskaż dwa miejsca, w których mowa Toniego przechodzi od patosu do trywialności.",
 tags:["P3","P4","P5"], th:["T4","T9"],
 mn:"Z Twoich notatek: „papier jest elementem tajemnicy, który nie wyjaśnia jej”, „niezapisany papier nie wyjaśnia tajemnicy” (s. 4). To dobry trop. Dopisz, kto wypowiada się o papierze (Toni, nie narrator)."},

{id:"ST8", w:"T", loc:"rozdz. I, [467]–[468]", title:"Wenecja: „znudzona wielka dama”",
 quote:"miastem, które zaiste że przeżyło idyllę, dramę, nadużyło tragedji i komedji i które, jako znudzona już wszystkiem wielka dama, pozostało piękne i czarowne",
 fakt:"Po monologu Toniego narrator opisuje Wenecję: miasto na palach, targ rybaków, schronienie uskoków, republika kramarska, miasto, które „nadużyło tragedji i komedji”. Potem pokazuje potomków patrycjatu, którzy milczeniem i dumą znoszą obcy rząd, „jakby wygnańcy”. Opisuje wejście do pałacu od kanału lub od tyłu (kosz na linie, mozaikowe schody z herbami, papuga). Wspomina gondolierów śpiewających Tassa i wieczorne powroty.",
 narr:"Narrator mówi do „ty” (drugoosobowe „mogłeś”, „wchodziłeś”), tworząc wrażenie wspólnego doświadczenia. To zmiana tonu na liryczno-wspomnieniowy.",
 means:"Personifikacja (dama); anafora „miastem…”; przejście na drugą osobę; zderzenie piękna i upadku; barwne szczegóły (kosz na linie, papuga).",
 znaczenie:"Wenecja jest tu miastem pamięci (Dambek-Giallelis: „semiofory”, czyli nośniki pamięci o tym, czego nie ma) i miastem „znudzonym wszystkim”. Rzepczyński widzi w „znudzonej damie” obraz współczesności, która zapomina o przeszłości i szuka sensacji zamiast głębokich tajemnic.",
 alts:[
  {l:"Wenecja jako archiwum pamięci (Dambek-Giallelis [T])", t:"Szczegóły historyczne pokazują lukę między tym, co minione, a obecnym życiem narratora."},
  {l:"Wenecja jako alegoria współczesności (Rzepczyński [T])", t:"Miasto, które „przeżyło” wszystkie gatunki, teraz szuka tylko sensacji; dlatego tajemnicę zamienia na zagadkę."},
  {l:"Paryż pod maską Wenecji (Kącka [T])", t:"Autorka podkreśla, że kontekst paryski jest silniejszy; Wenecja może pełnić rolę kamuflażu."}],
 pro:"Trzy opracowania, trzy różne role Wenecji z tego samego fragmentu.",
 con:"Każda z nich jest interpretacją, nie faktem tekstowym; nie wolno traktować ich jako jednego „zdania autora”.",
 q:"Które szczegóły opisu Wenecji są historyczne, a które nadane przez Norwida? Porównaj trzy role Wenecji i wybierz tę, którą najlepiej poprą fragmenty rozdziału I.",
 tags:["P1","P5"], th:["T7"],
 mn:"Z Twoich notatek: „poetycki opis Wenecji jako miasta pięknego, wyniosłego i pełnego sprzeczności” (s. 5, fioletowy). Wykorzystaj to jako punkt wyjścia do porównania z trzema badaczami."},

{id:"ST9", w:"T", loc:"rozdz. II, [468]–[469]", title:"Spór przy stole: papier, wyjście damy i wolność sztuki",
 quote:"Dopiero, umiejąc wszystko wypowiedzieć, jest się wolnym, a bez tejto wolności sztuka nie może mieć istotnego ruchu i życia",
 fakt:"Przy opustoszałym stole hotelu hrabia della Brenta mówi o „trywialności” opowieści Toniego. Kawaler di San Luca, wenecki doktor, uważa, że lord nie zasługuje na pośmiech. D... zawołał o papierze „czytelnym dla nosów policji”. Ktoś szepce „Papier! I czyli istotnie piśmienny papier?”. Dama wstaje, bierze dziecko i wychodzi. Narrator mówi, że nie zamierza naśladować takiego „jałowego przykładu” i że pisarz, który musi odrzucać treść rubaszną, nie wiadomo od czego jest artystą.",
 narr:"Narrator wchodzi z komentarzem poetologicznym: dyskusja o granicach tematu w literaturze, w pierwszej osobie liczby mnogiej („nie zamierzamy tu w opowiadaniu naszem”).",
 means:"Scena zbiorowa; komentarz o dziecku i pomarańczach; deklaracja artystyczna; przejście od plotki do sporu.",
 znaczenie:"Odejście damy to gest moralnej ochrony dziecka, który narrator odrzuca jako „jałowy”. Dla narratora sztuka wymaga swobody mówienia o całości (także o nieczystości). To ważne dla odczytania noweli jako opowieści o swobodzie mówienia.",
 alts:[
  {l:"Teoria sztuki ukryta w noweli", t:"Narrator broni prawa do mówienia o wszystkim, co potem lord zrobi w mowie o czystości. [I]"},
  {l:"Ironia narratora wobec konwencji obyczajowej", t:"Wzór dobrych manier (dama wychodzi) jest przedstawiony jako gest pusty. [I]"}],
 pro:"Deklaracja narratora jest jawna i pada w środku akcji.",
 con:"Narrator może mówić to także jako „poseł” własnego interesu (chce, by nowela była rubaszna); zwróć uwagę na ton („zaiste że niewiadomo”).",
 q:"Wypisz, kto w tej scenie coś mówi, kto tylko szepce, kto wychodzi bez słowa. Jak narrator uzasadnia, że nie pójdzie za przykładem damy?",
 tags:["P2","P3","P5"], th:["T4","T12"]},

{id:"ST10", w:"T", loc:"rozdz. II, [469]–[470]", title:"Zakład o statek maskaradowy i delegacja",
 quote:"Moje zachowanie się podczas sporu, do tej doszłego doniosłości, że być mogło zbyt obojętnem i wyłącznem, uważałem za właściwe przynajmniej kilkoma stosownemi wyrazy wziąć mój udział.",
 fakt:"Po kłótni o cel lotów dochodzi do zakładu. Stawką jest złocony statek maskaradowy przygotowywany na dzień św. Marka. Narrator, dotąd obojętny, włącza się: proponuje odwołać się do samego lorda, więc zostaje delegatem (w delegacji: D..., hrabia della Brenta, kawaler di San Luca). Zbiera karty deputacji i posyła majordomowi. Majordomo odpowiada, wyznaczając godzinę przedśniadaniową następnego dnia.",
 narr:"Zmiana funkcji: narrator z obserwatora staje się uczestnikiem („ja”-delegat). Rzepczyński pokazuje „ironię podwójną”: wobec uczestników sporu i wobec konwencji, że narrator „popycha” akcję.",
 means:"Przywołanie Rialto jako miary oczywistości; cytat z Arystofanesa; ton protokołu; humor sytuacyjny (ten, który wykazał słabą stronę, zostaje „użyty” do jej uzupełnienia).",
 znaczenie:"Zakład obniża „wielką tajemnicę” do stawki w zabawie karnawałowej (statek maskaradowy). Jednocześnie daje narratorowi fabularny powód, by spotkać lorda.",
 alts:[
  {l:"Narrator jako „nowelopisarz” (Rzepczyński [T])", t:"Narrator dba o to, by nowela miała punkt kulminacyjny; sam ingeruje w fabułę."},
  {l:"Narrator jako jeden ze „zgadobliwych”", t:"Chce poznać tajemnicę; w tej scenie dołącza do pozostałych. [I] — Rzepczyński pisze o tym w kontekście „niewiedzy narratora o tajemnicy”."}],
 pro:"Narrator wprost mówi o swoim „udziale” i o tym, że delegacja pomoże rozstrzygnąć zakład.",
 con:"To, że narrator uczestniczy, nie przesądza, że jest „taki sam jak inni”; zachowuje dystans (ironia w „doniosłości”).",
 q:"Jak narrator opisuje własny udział? Co ten opis mówi o jego stosunku do sporu, zakładu i innych uczestników?",
 tags:["P2","P3","P4"], th:["T3","T10"],
 mn:"Z Twoich notatek: „narrator staje się bezpośrednim uczestnikiem” i „narrator zostaje delegatem Wenecji” (s. 6–7). Dobrze zauważone. Dopisz fragment i doprecyzuj: delegatem hotelowych biesiadników, nie całej Wenecji."},

{id:"ST11", w:"T", loc:"rozdz. II, [470]", title:"Salon lorda i „misja” Wenecji",
 quote:"Czas miałem spojrzeć dookoła, to unosząc wrażenie, że najmniejszego śladu ani użytkowania, ani życia w tym salonie wcale nie było.",
 fakt:"Przed spotkaniem narrator opisuje, jak Wenecja „ma misję” pokazywać człowiekowi, że istnieje „fantastyczna sfera życia”: plac może być salonem, cztery konie z brązu mogą „igrać” na kościele. Następnego dnia delegacja wchodzi do salonu: brak książki, nut, albumu, karty wizytowej; mozaikowa posadzka i lustra „odzwierciadlają wszystkość”, jaśniej niż uroczo. Lord wchodzi, majordomo ustawia fotele.",
 narr:"Narrator przechodzi od uogólnienia o Wenecji do dokładnego opisu wnętrza. Zauważa brak śladów życia.",
 means:"Anafora i uogólnienie („że plac może być salonem…”); opis przestrzeni jako lustra; ceremoniał.",
 znaczenie:"Wnętrze lorda jest przeciwieństwem Wenecji: puste, lśniące, bez śladu użycia. Pokazuje bohatera jako człowieka, którego czystość zakłada brak ciała i śladów. [I]",
 alts:[
  {l:"Salon jako obraz idei czystości", t:"Lustra i posadzka odbijają wszystko, a nic nie zostaje: wnętrze podporządkowane jednej idei. [I]"},
  {l:"Kontrast z Wenecją „fantastyczną”", t:"Miasto jest wielokulturowe i pełne zabawy, salon jest sterylny. [I]"}],
 pro:"Narrator wprost zauważa brak śladu życia, nie tylko luksusu.",
 con:"Pusty salon może być też po prostu wynajętym apartamentem w hotelu (lord dopiero co przybył).",
 q:"Co w opisie salonu mówi o lordzie, a co może wynikać z tego, że to apartament hotelowy? Jak to się łączy z poprzednim akapitem o „misji” Wenecji?",
 tags:["P1","P3","P5"], th:["T5","T7"]},

{id:"ST12", w:"T", loc:"rozdz. II, [470]–[471]", title:"Mowa delegata i odpowiedź lorda: czystość jako cel",
 quote:"Przyczyną główną codziennego używania aeronaucji jest moje pojęcie o czystości, — celem jest czystość.",
 fakt:"Delegat przedstawia dwie szkoły (meteorologia, higiena) i zakład. Lord odpowiada, że żadna nie wygra: meteorologia należy do jego aeronauty, higienę (żołądkową) ma uregulowaną przed lotami, ale „cel wszelako onychże nie jest z tej sfery”. Przyznaje, że tajemnice muszą być (ludzie śmieją się z tego, czego od razu nie pojmują, więc pozostaje milczeć). Wyjaśnia: przyczyną jest jego pojęcie o czystości.",
 narr:"Narrator relacjonuje mowę lorda w całości jako cytat. Ocena pojawi się dopiero na końcu (obłąkanie, „manja”).",
 means:"Ton uroczysty, uprzejmie sarkastyczny; konstrukcja przeczenia (ani… ani…); odwrócenie spodziewanej odpowiedzi.",
 znaczenie:"Lord odrzuca oba domysły, a wskazuje cel, który nikogo nie satysfakcjonuje. Rzepczyński pisze: tajemnica mimo wyjaśnienia pozostaje tajemnicą, a właściwa tajemnica dotyczy wartości i sposobu wystąpienia lorda. W wypowiedzi pojawia się porównanie Europejczyków z grupą ludzi, którego dziś nie przyjmujemy, a które charakteryzuje język epoki i postać mówiącą.",
 alts:[
  {l:"Lord jako ekscentryk z logiką własną (Rzepczyński [T])", t:"Postać nakreślona „z nachyleniem ku grotesce”; trudno widzieć w niej nośnik wartości aprobowanych przez autora. Lord nie ma tajemnicy, ale na nią wskazuje."},
  {l:"Czystość jako program (Gomulicki za Kącką [B])", t:"Kącka cytuje Gomulickiego, który łączy nowelę z „filozofią nieczystości” i krytyką cywilizacji XIX w."}],
 pro:"Lord wprost podaje przyczynę i cel; wypowiedź jest wewnętrznie spójna.",
 con:"Narrator, a później doktor, nie traktują tego jako rozwiązania; lord jest przedstawiony z komizmem (chustka, powolność).",
 q:"Rozdziel w mowie lorda: co odrzuca, co przyjmuje, co dopiero wprowadza. Jakie ma znaczenie, że mówi o tajemnicy w kontekście śmiechu i milczenia?",
 tags:["P2","P3","P5"], th:["T2","T5","T12"],
 mn:"Z Twoich notatek: granatowe zaznaczenie „śmiech i jego źródło”: „ludzie śmieją się z tego, czego nie rozumieją” (s. 8). Zauważ, że to słowa lorda (postaci), a nie narratora. Sprawdź jeszcze, czy narrator w całej noweli to potwierdza."},

{id:"ST13", w:"T", loc:"rozdz. II, [471]–[472]", title:"Protest: Ksantypa, kloaki i „niskość”",
 quote:"Nieczystość jest to niskość!... Jest to niskość!...",
 fakt:"Lord mówi, że miasta wznoszą się na kloakach, a wykwintne salony stoją na „podziemiach ciężkich i odrażających”. Municypalności walczą z kałem, ale „degradują ludzi”. Ogłasza protest. Przywołuje Ksantypę: jej wina polega na tym, że nie wylała urny perfum z okna i zrobiła to z niskiego stanowiska. „Nieczystość jest to niskość”. Na wysokości balonu nie ma nieczystości. Trefniś rzucił anegdotę o nieczystym papierze z balonu; lord odpowiada, że to z okna Ksantypy. „Czystość zależy na podniesieniu się, nieczystością jest poniżenie się”. Kończy: „Ludzie nie są jeszcze czyści... są dopiero perfumowani...” i ociera łzę.",
 narr:"Narrator relacjonuje bez komentarza. Opisuje drobne gesty lorda (przecieranie kącika oka, ręka na ramieniu doktora). Dystans zachowany przez opis „ruchu nieprzyśpieszonego, ale nieco namiętnego”.",
 means:"Dowód z mitu antycznego (Sokrates i Ksantypa) w wersji odwróconej; oś góra/dół jako argument; przerwy w mowie; scena łez przeciwstawiona śmiechowi („Kto ma błogą wolę śmiać się z tego, niechaj to pełni teraz”).",
 znaczenie:"To klucz do osi wartości w noweli: góra jako czystość, dół jako nieczystość i poniżenie. Lord odwraca wartość: nieczystość to nie brud, tylko poniżenie człowieka. Pojawia się także wątek papieru: lord odrzuca anegdotę o papierze jako pochodzącą „z okna Ksantypy”, a nie z balonu.",
 alts:[
  {l:"Inwersja (Kącka [T])", t:"Wzniosłość i nieczystość wzajemnie się ujawniają; autorka czyta nowelę z użyciem „prawa inwersji” i proponuje tropy kontekstowe (Boyer, Wilde, Swift) jako hipotezy."},
  {l:"Karnawałowy „dół” u Bachtina (hipoteza [H])", t:"Wątek „dołu” i ciała w mowie lorda (kloaki, fetor, Laokoon pod ulicami) można porównać z „materialno-cielesnym dołem”; sprawdź, czy funkcja jest ta sama (odnowa, ambiwalentny śmiech)."},
  {l:"Groteska i obłąkanie", t:"Lord jest śmieszny i smutny jednocześnie; narrator po wszystkim mówi o „manii” i „obłąkaniu”. Nie wolno uznać jego mowy za jedyne przesłanie noweli. [I]"}],
 pro:"Fragment daje oś semantyczną całego utworu: wysokość = czystość; poniżenie = nieczystość.",
 con:"Lord płacze i prosi o śmiech; ton mowy jest groteskowy. To osłabia pewność, że jest rzecznikiem autora.",
 q:"Co dla lorda znaczy „nieczystość”, a co dla Ciebie w zwykłym języku? Wskaż moment, w którym mowa lorda zmienia ton z wykładu na wyznanie.",
 tags:["P3","P4","P5"], th:["T5","T11","T13"],
 mn:"Z Twoich notatek: pomarańczowe „oś góra–dół” i uwaga: „góra oznacza wzniosłość i czystość, dół upodlenie i degradację” (s. 9); „najważniejszy fragment, wyrażenie ma znaczenie dosłowne, ale także symboliczne”. To najmocniejsza obserwacja z Twoich notatek. Teraz sprawdź ją krytycznie (kolumna „con”)."},

{id:"ST14", w:"T", loc:"rozdz. II, [472]", title:"Po audiencji: „obłąkanie”, Toni i regata",
 quote:"Raz tylko kilka znacznych grup obróciło spojrzenie swoje ku górze",
 fakt:"Po mowie nastaje cisza, bije zegar. Narrator zauważa, że delegacja rozwiązała zakład, ale „zagajony płocho”. Pyta, do jakiego rodzaju „obłąkania” policzy się „manja” lorda; doktor di San Luca nie podnosi tego z taktu. Toni z większym zapałem głosi, że lord jest „mężem misji”, zwiastunem „wielkiej epoki nowej”, „puryfikacji”, czegoś w rodzaju amerykańskiego „revivalu”. Nadchodzi regata św. Marka: kanał pełen łodzi „z różnych epok”, tłum patrzy w wir „archeologicznego szału”. Tylko kilka grup spogląda w górę, gdzie gondolierzy wskazują „maleńki i mdły punkcik”. „Był to balon lorda Singelworth.”",
 narr:"Narrator kończy bez własnej oceny: pada pytanie o obłąkanie, a puenta jest obrazem. Rzepczyński zauważa, że końcowy obraz nie przynosi puenty wprost i przenosi rozstrzygnięcie poza świat przedstawiony.",
 means:"Obraz pionowy (punkt w niebie) zestawiony z poziomym tłumem; „archeologiczny szał” (maskarada epok); powrót Toniego z nową wersją; zakończenie w trzeciej osobie bez komentarza.",
 znaczenie:"Zakład (statek maskaradowy) i tajemnica kończą się niczym: tłum patrzy na widowisko, lord jest „punkcikiem”. Interpretacja musi pochodzić od czytelnika. Dla P4: regata to prawdziwa scena karnawałowa (maskarady, flagi, tłum), a lord ponad nią.",
 alts:[
  {l:"Zakończenie jako parabola (Rzepczyński [T])", t:"Czytelnik „zgadobliwy” zostaje wśród tłumu; kompetentny odbiorca patrzy w górę i dostrzega istotę tajemnicy, nie anegdotę."},
  {l:"Legenda miejska (Kącka [T])", t:"Autorka uważa, że zakończenie służy legendzie: tajemnicza aura lorda pozostaje nienaruszona."},
  {l:"Karnawał bez lorda (hipoteza [H])", t:"Regata jest karnawałem, w którym lord nie uczestniczy; jego niewłaściwość tego świata może być sednem. Sprawdź to pojęciami Bachtina."}],
 pro:"Zakończenie pozostawia pytanie o obłąkanie bez odpowiedzi; Toni zmienia wersję na „misję”.",
 con:"Trzy lektury końcówki wykluczają się częściowo; potrzebny jest argument, która jest najlepiej uzasadniona przez tekst.",
 q:"Jak zmienia się stosunek między „górą” a „dołem” w ostatnim akapicie? Kto patrzy w górę, kto nie? Którą z trzech interpretacji zakończenia uznasz za najlepiej uzasadnioną i dlaczego?",
 tags:["P1","P4","P5"], th:["T6","T9","T15"],
 mn:"Z Twoich notatek: „widowisko pokazuje, że tłum skupia się na niewiele znaczącym spektaklu” (s. 10). Zgadza się z uwagą Rzepczyńskiego o tłumie na regacie; sprawdź, kogo pomijasz: kilka grup jednak patrzy w górę."},

/* ---------- BRANSOLETKA ---------- */
{id:"SB1", w:"B", loc:"rozdz. I, [450]", title:"Ośmiokątny salon i obraz z Emaus",
 quote:"Poważny ów przyjaciel mój stał przy mnie w oświeconym zlekka, ośmiokątnym salonie",
 fakt:"Narrator stoi z „poważnym przyjacielem” przed starym obrazem „w stylu Rembrandta” (Chrystus łamiący chleb z dwoma uczniami; przypis wskazuje „Wieczerzę w Emaus”, Luwr). Ten mówi o „istocie czynu odważnego” i o dramacie życia. Wchodzi piękna kobieta; przyjaciel mówi „To jest Eulalja”, po chwili „Jest to Barbara herbu Strzemię”, a potem „Edgarda”.",
 narr:"Narrator „milczy”, a przyjaciel „mówi”; narrator zbiera informacje od kogoś innego i dopiero wyciąga wnioski. Bardzo podobna konstrukcja wiedzy jak w „Tajemnicy…”: wiedza przez pośrednika.",
 means:"Obraz w obrazie (Rembrandt); zmiana imion tej samej osoby; dygresja o czasie i życiu; dialog urywany.",
 znaczenie:"Wprowadza temat tożsamości jako zależnej od nazw nadawanych przez otoczenie (Eulalja, Barbara, Edgarda). Wskazuje też temat patrzenia: obraz „oryginał czy kopia” zostaje bez rozstrzygnięcia („nie zastanawiałem się”).",
 alts:[
  {l:"Imiona jako role", t:"Chrzest, bierzmowanie i literatura nadają osobie trzy imiona. Pytanie, która „prawdziwa”. [I]"},
  {l:"Obraz jako klucz do całej noweli", t:"Chrystus przemieniony w gospodzie, pojedyncza twarz podróżnego „chrystusowieje” (por. SB3). [I]"}],
 pro:"Trzy imiona w jednej scenie są jawne i wyliczone.",
 con:"Nie wiadomo, czy trzy imiona mają wspólną „funkcję” z lordem Singelworth. To hipoteza porównawcza.",
 q:"Zbierz wszystkie imiona kobiety w tym fragmencie i powiedz, kto je nadaje i z jakiej okazji.",
 tags:["P2","P3","P5"], th:["T14","T15"]},

{id:"SB2", w:"B", loc:"rozdz. I, [450]–[451]", title:"Bal na końcu karnawału",
 quote:"że tak świetnej i hucznej zabawy zaprawdę przez cały karnawału ciąg nikt nie widział, lecz to właśnie dlatego wydarzyło się, iż post się zbliżał.",
 fakt:"Narrator rozmawia z Eulalją przy drzwiach sali balowej; muzyka, taniec, światło zachodzącego słońca. Rozmowa dotyczy karnawału: nigdy nie było tak świetnej zabawy, bo zbliża się post. Wychodząc, narrator siedzi w mdłym salonie i rozmyśla o imionach, karnawale i pokucie (post = czas sakramentu pokuty). Dochodzi „dobrze po północy”.",
 narr:"Narrator mówi „ja milczałem”, „nie taiłem”, „rozmyślałem”, wprowadza porządek liturgiczny (karnawał/post) jako rama czasowa.",
 means:"Przeciwstawienie karnawału i postu; muzyka i szelest jedwabiów jako tło; kolokwialność („nikt nie widział”).",
 znaczenie:"To najbardziej oczywiste miejsce, w którym karnawał jest motywem fabularnym i kalendarzowym. Rozmowa ironicznie łączy szczyt zabawy z jej końcem.",
 alts:[
  {l:"Karnawał w sensie kalendarza", t:"Bal jest ostatnią okazją przed postem; fabuła zaczyna się w nocy ostatniej zabawy. [I]"},
  {l:"Karnawał w sensie Bachtina (hipoteza [H])", t:"Wymaga sprawdzenia, czy tekst pokazuje odwrócenie hierarchii i ambiwalentny śmiech, czy tylko świecką zabawę przed pokutą."}],
 pro:"Karnawał i post są wymienione wprost.",
 con:"Obecność balu to nie karnawalizacja w sensie Bachtina; tutaj nie ma „ludowego” śmiechu, tylko salon.",
 q:"Wypisz wszystkie miejsca, w których tekst wymienia karnawał lub post. Jak zmienia się ich znaczenie od początku do końca noweli?",
 tags:["P4","P5"], th:["T9","T14"]},

{id:"SB3", w:"B", loc:"rozdz. I, [451]", title:"Rembrandt, światło i „chrystusowienie”",
 quote:"przemienia się i chrystusowieje",
 fakt:"Narrator siedzi w ośmiokątnym salonie i patrzy na obraz. Zachwyca się światłocieniem: do Rembrandta „nikt, nawet i Rafael sam, nie znał światła”; Rembrandt odkrył „głęboką światła tkliwość i mistyczną logikę”. Mówi o zwykłym wyrazie twarzy podróżnego łamiącego chleb, który „chrystusowieje”.",
 narr:"Narrator wykłada własną opinię o sztuce; to moment, w którym jest bliżej poety-krytyka niż uczestnika wydarzeń.",
 means:"Dygresja estetyczna; opozycja Rafael/Rembrandt; neologizm „chrystusowieje”.",
 znaczenie:"Zwykłe (podróżny w gospodzie) może się przemienić w wielkie. To odpowiada idei, którą Kącka nazywa „prawem inwersji” (wielkie w małym), ale w tej scenie to idea wyłożona wprost, nie ironiczna. [I]",
 alts:[
  {l:"Estetyczna zasada noweli", t:"Zwykła twarz z ulicy może pokazać boskość; przygotowuje scenę ze śmieciarzem i wiatykiem. [I]"}],
 pro:"Tekst wprost wiąże „potoczny” wyraz twarzy z przemianą (chrystusowieniem).",
 con:"To tylko jedna scena; porównanie z Kącką jest moim skojarzeniem, nie jej tezą o tym fragmencie.",
 q:"Jak narrator rozróżnia Rafaela i Rembrandta? Co to ma wspólnego z późniejszymi scenami na ulicy?",
 tags:["P2","P5"], th:["T14"]},

{id:"SB4", w:"B", loc:"rozdz. II, [451]", title:"Znalezienie bransoletki",
 quote:"Któraż święta zgubiła chwałę swoją?",
 fakt:"O świcie narrator wychodzi, idzie ulicą i znajduje bransoletkę „złotem kołem”, jak „koła złote nad skroniami świętych”. Składa się z dwóch rogów obfitości; paszcze rogów jak potworów trzymają diamentowymi zębami dwie tarcze z napisami „Edgar” i „Eulalja”. Mówi, że „nie miał uczucia ciekawości, czyją znalazł zgubę”.",
 narr:"Narrator opisuje przedmiot dokładnie, ale odrzuca ciekawość. To przeciwieństwo „zgadobliwości” z „Tajemnicy…”.",
 means:"Porównanie do aureoli; ekfraza (opis przedmiotu); symbol (rogi obfitości z paszczami potworów); nazwy na tarczach.",
 znaczenie:"Przedmiot łączy świętość (aureola) i pożądanie (złoto, diamentowe zęby). Narrator nie szuka właściciela mimo wskazówek.",
 alts:[
  {l:"Przedmiot-znak", t:"Bransoletka ma znaczenie w fabule (ślubne okowy złote), w symbolice (aureola i okowy) i w ironii (świętość kontra pieniądz). [I]"}],
 pro:"Szczegóły opisu (aureola, paszcze, okowy) tworzą dwoistość.",
 con:"Interpretacja symboliczna jest moim odczytaniem; w tekście bransoletka nazwana jest też „okową”.",
 q:"Jak narrator opisuje bransoletkę i dlaczego odrzuca ciekawość? Porównaj to z postawą otoczenia wobec balonu lorda.",
 tags:["P2","P3","P5"], th:["T14","T15"]},

{id:"SB5", w:"B", loc:"rozdz. II, [451]", title:"Chłopiec śmieciarz",
 quote:"chłopiec blade miał oblicze, jako kamienie bruku wapienne",
 fakt:"Na pustej ulicy narrator widzi kilkuletniego śmieciarza z gasnącą latarką i hakiem większym niż wiek chłopca; kosz niepełny. Wozy ogrodników jadą na targ.",
 narr:"Opis ze współczuciem, bez komentarza moralnego. Narrator tylko patrzy.",
 means:"Porównanie do kamienia; kontrast haka i dziecka; ubogi pejzaż poranny.",
 znaczenie:"Pojawia się „dół” miasta: ludzie od odpadków. Później to ich dom odwiedza narrator.",
 alts:[{l:"Wątek „niskiego” i „wysokiego”", t:"Śmieciarz-dziecko stoi naprzeciw aureoli bransoletki i balu. [I]"}],
 pro:"Zestawienie tej sceny z balem jest widoczne w kompozycji noweli (bal → ulica → dom śmieciarza).",
 con:"Narrator nie wartościuje wprost; ocenę wprowadza czytelnik.",
 q:"Co łączy tego chłopca z postaciami z balu i z poetą? Czy narrator na niego patrzy tak, jak ludzie patrzą na lorda?",
 tags:["P3","P5"], th:["T14"]},

{id:"SB6", w:"B", loc:"rozdz. II, [451]–[452]", title:"Wiatyk i dom śmieciarza",
 quote:"jakoby tam był pochód króla wygnanego i ostatniego jakiego z panujących",
 fakt:"Narrator słyszy dzwonek, widzi purpurowy niegdyś baldachim i proboszcza z Najświętszym Sakramentem (wiatyk) idącego do chorego. Klęka. Idą do niskiej izby „mającej podziemia podobieństwo, ale utrzymanej czysto”: to dom ojca chłopca-śmieciarza. Chory uśmiecha się i zasypia. Narrator zostawia żonie bransoletkę: mąż „znalazłby ją, gdyby był zdrów”, niech dowiedzą się, czyja, i oddadzą.",
 narr:"Narrator uczestniczy w obrzędzie i oddaje bransoletkę. Zachowuje nieznajomość: nie wiemy, jak potraktuje sprawę.",
 means:"Kontrast purpury i nędzy; porównanie do „króla wygnanego”; liturgia; czystość izby.",
 znaczenie:"To „dół” podniesiony: najuboższa izba (czysta!) otrzymuje sakrament, a procesja jest „króla wygnanego”. Narrator wplątuje przedmiot z balu w ten świat.",
 alts:[{l:"Wątek czystości (zestawienie z „Tajemnicą…”)", t:"Izba „utrzymana czysto” stoi obok idei czystości lorda; to hipoteza porównawcza. [H]"}],
 pro:"Tekst zaznacza czystość izby wprost.",
 con:"Narrator nie komentuje; łączenie z „Tajemnicą…” to moja hipoteza.",
 q:"Zestaw trzy obrazy z tej sceny (baldachim, izba, śmieciarz). Jak każdy zmienia znaczenie „wysokiego” i „niskiego”?",
 tags:["P3","P5"], th:["T14","T15"]},

{id:"SB7", w:"B", loc:"rozdz. II, [452]", title:"Śniadanie z poetą",
 quote:"Poetą nie jesteś, więc nie wiesz tego",
 fakt:"Narrator idzie do poety (znajomy z ogrodu). Poeta w porannym ubraniu, z kartkami, mówi o bezsenności. Czyta „dziwnie piękne wiersze” o miłości „kobiety płochej”, po czym gniecie kartki. Gdy sługa wyjdzie, wołanie: „Eulalja!”. Edgar posłał już podarunki ślubne („okowy złote”). Narrator mówi, który śmieciarz znalazł zgubę; poeta woła: „Złotem go osypię!”.",
 narr:"Narrator przyjmuje rolę słuchacza, ujawnia znalezisko, ale decyzje podejmują inni. Zdanie „Jestże się poetą, czyli raczej tylko bywa się?” to wtrącona refleksja.",
 means:"Dialog; scena poety (autotematyczna); komiczna zmiana tonu (od poezji do „Złotem go osypię”).",
 znaczenie:"Poeta zamienia sensowną wiadomość na gest wielkiego pana; ironizuje się „wielkie uczucie”. Powiązanie ze „wzniosłymi uczuciami” z tytułu pracy Kąckiej jest moim skojarzeniem.",
 alts:[{l:"Ironia wobec poety", t:"Poeta jest zarazem wrażliwy i komiczny; jego „Eulalja!” wypowiedziane chrapliwie łączy uczucie i teatr. [I]"}],
 pro:"Ironia wynika z kontrastu wierszy i reakcji na wiadomość.",
 con:"Narrator darzy poetę sympatią („miły człowiek”), więc ironia nie jest jednoznaczna.",
 q:"Wskaż dwa momenty, w których poeta zachowuje się w sposób teatralny. Co narrator o nich myśli?",
 tags:["P2","P3"], th:["T10","T14"]},

{id:"SB8", w:"B", loc:"rozdz. III, [452]–[453]", title:"Post, „Omen” i szczęśliwe zakończenie",
 quote:"P. S. Eulalja poszła za bankiera i są szczęśliwi.",
 fakt:"W czasie postu narrator choruje. Poeta wbiega: „Omen, Omen” i oznajmia, że Edgar jest odrzucony. Przez dłuższy moment zostają wołania („Płochość! Kokieterja! Eulalja!”). Wchodzi Eulalja w czarnej sukni z bankierem, zbierającym na tacę kwestę. Edgara nie ma, „z gniewu mnichem chciał zostać!”. Narrator wrzuca srebrną monetę. Wszyscy idą na kazanie „O sakramentach w ogólności”. Post scriptum: Eulalja wyszła za bankiera i są szczęśliwi.",
 narr:"Narrator jest chory, a wiadomości dociera do niego z drugiej ręki. Zakończenie przesuwa ironię na P. S.",
 means:"Przerwa w tekście (kreski); post scriptum jako lakoniczna puenta; kontrast „sakramentów w ogólności” i ślubu z bankierem.",
 znaczenie:"Zakończenie ośmiesza „wzniosłość” historii (okowy złote, Edgar jako mnich) przez finansowe „szczęście”. Nie ma tu jawnej oceny; trzeba ją dopowiedzieć.",
 alts:[{l:"Ironia strukturalna", t:"Fabuła pełna symboli kończy się trzeźwą informacją o małżeństwie z bankierem. [I]"}],
 pro:"Puenta jest w P. S., czyli poza głównym tokiem.",
 con:"Nie wiadomo, czy „szczęśliwi” jest ironią, czy zwykłą informacją. To otwarte pytanie.",
 q:"Jak odczytasz „i są szczęśliwi” w kontekście całej historii? Podaj dwa odczytania i wskaż, co je różni.",
 tags:["P2","P3","P4","P5"], th:["T10","T14","T15"]},

/* ---------- AD LEONES! ---------- */
{id:"SL1", w:"L", loc:"[473]", title:"Rzeźbiarz, charcica i Café-Greco",
 quote:"ów rudobrody rzeźbiarz, który o godzinie zamknięcia prac chadzał prawie co wieczór do Café-Greco z wielką swoją charcicą kirgiskiego pochodzenia.",
 fakt:"Nowela zaczyna się opisem rzeźbiarza i jego psa. Narrator wnioskuje o „umysłowej godności osoby” z doboru zwierzęcia (anegdota o generale Jominim i koniu). Charcica przeskakuje ciżbę chłopców i stoły w kawiarni, „żadnego poklasku nie oczekiwała”. Jest „cenną u wszystkich”.",
 narr:"Narrator opisuje, wnioskuje i komentuje z ironicznym dystansem; mówi „dawać mógł mniemać”, „utrzymywać byłoby właściwem”.",
 means:"Pseudonaukowy wywód o psach i ludziach; hiperbola zalet charcicy; ironia wobec fizjonomiki.",
 znaczenie:"Już pierwsza scena pokazuje, jak z pozoru dowodzi się wartości człowieka po zwierzęciu (zewnętrznym znaku). To odpowiednik „zgadobliwości” z „Tajemnicy…”: wnioskowanie ze znaków.",
 alts:[{l:"Ironia narratora wobec „czytania” ludzi", t:"Nowela od początku pokazuje wątpliwy sposób oceniania człowieka z zewnątrz. [I]"}],
 pro:"Wniosek narratora zostaje zachwiany później (pies pozostaje szlachetny, rzeźbiarz sprzedaje dzieło).",
 con:"Nie wiadomo, czy ironia obejmuje także narratora, czy tylko „obserwatorów” w kawiarni.",

{id:"SL2", w:"L", loc:"[473]–[474]", title:"Grupa kawiarniana: redaktor, śpiewak, malarz, turysta i guwerner",
 quote:"dla kształcenia się w zapatrywaniu na rzeczy",
 fakt:"Wokół rzeźbiarza stoi grupa: redaktor „Gazety beletrystyczno-politycznej”, śpiewak dający lekcje cudzoziemcom, malarz, młodzieniec-turysta (wysłany przez rodziców „dla kształcenia się w zapatrywaniu na rzeczy”) i jego guwerner. Redaktor „stylem człowieka pióra” przypomina szklane świdry, które naśladują wodę w paszczach gipsowych lwów. Guwerner nadużywa przymiotnika „scientyficzny” i pisze „Rzut oka...”. Narrator zauważa: w południowym mieście wiedza o ludziach jest „przezroczysta”.",
 narr:"Narrator typizuje; używa metafor („szklane świdry”) i przypisuje redaktorowi „elokwencję”. Ironicznie ocenia styl.",
 means:"Typizacja postaci; porównanie do fontanny z lwami (Ad leones w wersji gipsowej); powtarzalne słowo „scientyficzny”.",
 znaczenie:"Redaktor i guwerner to ludzie, którzy mówią bez „życia” (jak woda z szkła). Zderzają się z rzeźbiarzem. To społeczność, która kształtuje dzieło sztuki.",
 alts:[{l:"Krytyka języka publicznego", t:"Styl redaktora to pusta elokwencja; guwerner to pseudonauka. Porównaj z „zgadobliwością” i „scjentyficznie” w „Tajemnicy…”. [I]"}],
 pro:"Słowo „scientyficzny” pojawia się w obu nowelach (tu w wersji guwernera, w „Tajemnicy…” u narratora).",
 con:"To zbieżność leksykalna; sama nie dowodzi wspólnej koncepcji.",
 q:"Wypisz cechy każdego członka grupy. Który z nich ma wpływ na los dzieła rzeźbiarza?",
 tags:["P2","P3"], th:["T13","T15"]},

{id:"SL3", w:"L", loc:"[474]", title:"Plac Hiszpański i przezwisko „Ad leones!”",

 fakt:"Plac Hiszpański i schody na Monte Pincio to „forum modelów”: tu wystarczy zbliżyć się, by usłyszeć o pracy każdego artysty. Wiadomo, że rzeźbiarz tworzy kolosalną grupę z dwoma chrześcijanami rzuconymi lwom za Domicjana. Koledzy wołają na niego „Ad leones!”, a on odpowiada gestem. Narrator chwali „dobrą wolę publiczności”, ale zaznacza, że szczęśliwy ten artysta, który umie ją „trzeźwo” przyjąć.",
 narr:"Narrator uogólnia („w przezacnym Rzymie”; „północnym chłodnym nieznane stronom”). Porównuje Rzym i północ.",

 znaczenie:"Rzym to miejsce, gdzie dzieło sztuki rośnie we wspólnej wyobraźni. To wprost krytyczna ocena opinii publicznej (dobrej woli, ale także nacisku).",
 alts:[{l:"Rzym jako warunek noweli", t:"Miejsce publicznego mówienia o sztuce (Café-Greco, plac) umożliwia fabułę. [I]"}],
 pro:"Tekst wymienia konkretne miejsca Rzymu (Café-Greco, Plac Hiszpański, Monte Pincio).",
 con:"Nie wolno mieszać realiów historycznych z funkcją, jaką Norwid nadaje Rzymowi.",
 q:"Co Rzym daje rzeźbiarzowi i dziełu w tej scenie? Porównaj z rolą Wenecji w „Tajemnicy…”.",

{id:"SL4", w:"L", loc:"[474]–[475]", title:"Narrator i „dwie głowy”",
 quote:"Tej i tamtej oczy zwrócone są wgórę — — —",
 fakt:"Narrator spotyka rzeźbiarza i redaktora rano w kawiarni. Zaproszony do pracowni, mówi, że to nie będzie dzieło ukończone. Pytany o własną pracę, mówi o „dwóch głowach”: jedna ma podnosić oczy ku niebu, druga ku sufitowi albo hakowi z świecznikiem. Obie patrzą wgórę; to zadanie go „umęczyło”. Rzeźbiarz opiera czoło na dłoni, redaktor kreśli kreski na marmurze.",
 narr:"Narrator mówi o sobie jako „niezbyt wielkim” w sztuce; wypowiada dwuznaczne zdanie.",
 means:"Dwuznaczność: dwie głowy patrzą w górę z odmiennych powodów (niebo/hak świecznika). Reakcja słuchaczy: milczenie.",
 znaczenie:"To zagadka, którą słuchacze pomijają. Zdanie o dwóch głowach można odczytać jako ironiczny komentarz o różnicy między wzniosłym i przyziemnym spojrzeniem „wgórę”. [I]",
 alts:[{l:"Autoironia narratora", t:"Narrator naśmiewa się z własnej „sztuki”; sądź, czy to zakamuflowana krytyka grupy. [I]"}],
 pro:"Powiązanie z końcówką „Tajemnicy…” (spojrzenie w górę) jest widoczne w obrazie.",
 con:"To zbieżność motywu; wymaga dowodu, że Norwid zamierzał to porównanie.",
 q:"Co znaczy, że dwie głowy patrzą „wgórę” z dwóch różnych powodów? Jak reagują słuchacze i co to mówi o ich uwadze?",
 tags:["P2","P3"], th:["T10","T15"]},

{id:"SL5", w:"L", loc:"[475]–[476]", title:"Pracownia: glina, „Brawo” i Domicjan",
 quote:"— Ad leones, ad leones! — wołał młody turysta.",
 fakt:"W pracowni stoi wielka masa wilgotnej gliny — zaczęta grupa. Gdy rzeźbiarz zdejmuje mokre płótna, rozlegają się „Brawo, brawo”. Męska postać „obiecuje piękny tors”, dziewicza „dramatyczny obrót”, obie błogosławią znakiem krzyża „pro Christo”; lew to jeszcze bryła podobna do sprzętu. Turysta woła „Ad leones!”; malarz mówi, że jego własne dzieło „może to być Kleopatra, a może Wniebowzięcie”. Guwerner wskazuje bust: „Oto, zda mi się Domicjan!”. Rzeźbiarz kopniakiem odbija nos Cezarowi. Śpiewak i towarzysze śpiewają „Drżyjcie, tyrany świata”.",
 narr:"Narrator relacjonuje z dystansem; zauważa, że „lew jest bryłą podobną do sprzętu”, co daje pozór wykończenia.",
 means:"Komizm sytuacyjny; chór aplauzu; pieśń rewolucyjna; kopniak jako gest „teatralny”.",
 znaczenie:"Dzieło „o męczeństwie” jest przyjmowane jak przedstawienie. Entuzjazm tłumu nie dotyka treści, tylko nastroju. Rzeźbiarz „nabiera tonu” wyzywającego świat do walki.",
 alts:[{l:"Ironia sytuacyjna", t:"Rewolucyjna pieśń śpiewana przy przełamywaniu popiersia cesarza jest zabawą, nie czynem. [I]"}],
 pro:"Wszyscy aplauzują, gdy dzieło jeszcze jest bryłą gliny.",
 con:"Nie wiadomo, czy narrator widzi w tym tylko komizm, czy także dramat artysty.",
 q:"Co dokładnie jest w tej scenie przedmiotem aplauzu? Jak różni się to od przedmiotu dzieła?",
 tags:["P3","P4"], th:["T13"]},

{id:"SL6", w:"L", loc:"[476]–[477]", title:"Usunięcie krzyży i klucz",
 quote:"Na cóż koniecznie ten znak martwy",
 fakt:"Redaktor sugeruje odjęcie krzyży z rąk figur, bo amerykański nabywca (np. „mojżeszowego wyznania”) mógłby nie kupić. Rzeźbiarz zwraca uwagę, że krzyże „załamują stosownie bieg głównych linij”. Narrator mówi o trudności wykonania ręki z krzyżem i nieopatrznie daje argument usunięcia. Rzeźbiarz odcina krzyż u mężczyzny. Guwerner „scientyficznie” sugeruje klucz w ręku kobiety (klucze św. Piotra, Apokalipsa). Rzeźbiarz formuje klucz. Gdy zaprotestuje, redaktor odpowiada: „Czy ta grupa jest dziełem historycznem?”, a guwerner mówi, że to mogą być „wcale nie chrześcijanie”.",
 narr:"Narrator uczestniczy, ale jego uwaga „poszła” w złym kierunku. Zauważa „magiczne” działanie zbiorowości: „ogólny nakłon pojęć i uczuć, a zupełny brak rozumowanej protestacji”.",
 means:"Logika „plastyczna” wzięta za argument; zmiana symbolu (krzyż → klucz); komizm sytuacyjny; zbiorowa presja.",
 znaczenie:"Najbardziej wyraźna scena „inwersji”: sens dzieła zmienia się z męczeństwa na dowolną „walkę” i „zasługę”. Zbiorowość nie protestuje; autor jest współwinny.",
 alts:[{l:"Sztuka i rynek", t:"Wartość dzieła zależy od nabywcy. [I]"},{l:"Wspólna wina", t:"Narrator niechcący pomaga w usunięciu symbolu; nie jest tylko obserwatorem. [I]"}],
 pro:"Tekst wprost wskazuje, że narrator „otrzymał niezamierzony skutek” swoją uwagą.",
 con:"To scena o sztuce i rynku; nie wolno ekstrapolować jej na całą noweli o religii.",
 q:"Kto i jakim argumentem odejmuje krzyż, a kto wprowadza klucz? Czy narrator ponosi współodpowiedzialność?",
 tags:["P2","P3","P5"], th:["T13","T15"]},

{id:"SL7", w:"L", loc:"[477]–[478]", title:"Amerykanin i „Kapitalizacja”",
 quote:"Grupa wyobraża Kapitalizację w sposób i wyrozumowany i przystępny...",
 fakt:"Wchodzi Amerykanin, korespondent „wielkiego monitora Stanów Zjednoczonych”. Prosi o wyjaśnienie figur. Redaktor mówi, że mężczyzna to energia czynu, a kobieta zaleca swój udział. Amerykanin zauważa klucz w ręku kobiety i bryłę niżej (kufer) i orzeka, że kobieta to Oszczędność, że obok kufra powinny być narzędzia rolnicze, a grupa to „Kapitalizacja”. Rzeźbiarz dolepia sierp i dwa boki kufra. Na kartach spisują umowę: „Kapitalizacja” z białego marmuru za około 15.000 dolarów; rzeźbiarz podejmuje się wykonania za nieprzechodzące o wiele 75.000 lirów.",
 narr:"Narrator opisuje dokładnie umowę. Komentarz ironiczny pojawia się w sposobie przytoczenia dokumentów.",
 means:"Parodia interpretacji (alegoria zamieniona na „Kapitalizację”); dokumenty umowy; komizm niedopasowania (dolary/liry).",
 znaczenie:"Dzieło o męczeństwie zostaje zdegradowane do alegorii oszczędności. Interpretacja nabywcy obiera kształt dzieła. Zobacz zbieżność z „Tajemnicą…”: interpretacja otoczenia kształtuje przedmiot, nie odwrotnie.",
 alts:[{l:"Parabola o rynku sztuki", t:"Dzieło zależy od woli kupującego i opinii redaktora. [I]"}],
 pro:"Zamiana „męczeństwa” na „Kapitalizację” jest jawnie pokazana.",
 con:"Autor nie wskazuje wprost, że potępia Amerykanina; to postać karykaturalna, ale też rzeczowa.",
 q:"Wypisz kolejne zmiany znaczenia grupy od „Ad leones!” do „Kapitalizacji”. Kto za każdą z nich odpowiada?",
 tags:["P3","P5"], th:["T13","T15"]},

{id:"SL8", w:"L", loc:"[478]", title:"„Trzydzieści srebrników” i sumienie",
 quote:"— To tak, jak sumienie jest sumieniem — odpowiedziałem.",
 fakt:"Gdy Amerykanin wychodzi, rzeźbiarz zarzuca mokre płótna na „Kapitalizację” i biegnie za gośćmi. Narrator czuje poniżenie ducha i słyszy „jęk”: wszystko, co się poczyna z „dziewiczego natchnienia myśli”, musi być sprzedane za sześć dolarów, czyli „trzydzieści srebrników”. Mówi do redaktora: „Jak to jednak daleko od wyznawców, i dla wyznania lwom rzuconych, do Kapitalizacji!”. Redaktor kreśli parasolem na bruku: „Redakcja nie jest telefonem… Redakcja jest redakcją…”. Narrator: „To tak, jak sumienie jest sumieniem”.",
 narr:"Narrator wychodzi z roli obserwatora i oceniającego, powtarza słowa redaktora w ironicznej formule. Zakończenie nie daje rozwiązania.",
 means:"Aluzja biblijna (trzydzieści srebrników; Hiob); tautologia „redakcja jest redakcją” jako ironiczne wykręcanie się; powtórzona formuła narratora.",

{id:"A1.2", p:"P2", title:"Kiedy narrator staje się uczestnikiem", sc:["ST9","ST10"], lvl:"podst.",

{id:"A1.3", p:"P2", title:"Wspomnienie, nie raport", sc:["ST1","ST8"], lvl:"podst.",

{id:"A1.4", p:"P2", title:"Porównanie narratorów dwóch nowel", sc:["SB1","ST1","SB8"], lvl:"rozsz.",

<script>
(function(){
"use strict";
var KEY="olijp-singelworth-v1";
var VIEWS=[["start","S","Start"],["atlas","A","Atlas scen"],["zagadnienia","P","Zagadnienia"],["tezy","T","Tezy"],["opracowania","O","Opracowania"],["cwiczenia","Ć","Ćwiczenia"],["pojecia","W","Pojęcia"],["tematy","◆","Tematy"],["wypracowanie","✎","Wypracowanie"],["zeszyt","Z","Zeszyt"]];
var st={done:{},marks:{},notes:{},general:"",essay:{topic:"O1",title:"",sign:"",text:"",status:"szkic",snap:"",updated:""},feedback:null,theme:"",last:"start"};
var okStore=true;
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);for(var k in o)st[k]=o[k];}}catch(e){okStore=false}}
var saveT=null;

function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function link(s){
  s=esc(s);
  s=s.replace(/\b(S[TBL]\d+)\b/g,'<a href="#$1" data-go="$1">$1</a>');
  s=s.replace(/\b(A\d\.\d)\b/g,'<a href="#$1" data-go="$1">$1</a>');
  return s;
}
function tagc(c){return '<span class="tg tg-'+c+'" title="'+({T:"przeczytane źródłowo",B:"tylko dane bibliograficzne lub z drugiej ręki",N:"brak lektury lub dostępu",I:"własna interpretacja",H:"hipoteza do sprawdzenia"}[c]||"")+'">['+c+']</span>';}
function mark(s){return esc(s).replace(/\[(T|B|N|I|H)\]/g,function(m,c){return tagc(c)}).replace(/\b(S[TBL]\d+)\b/g,'<a href="#$1" data-go="$1">$1</a>').replace(/\b(A\d\.\d)\b/g,'<a href="#$1" data-go="$1">$1</a>');}
function words(t){var m=(t||"").trim().match(/\S+/g);return m?m.length:0}
function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;t.setAttribute("role","status");document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function sceneById(id){for(var i=0;i<SCENES.length;i++)if(SCENES[i].id===id)return SCENES[i]}
function exById(id){for(var i=0;i<EXERCISES.length;i++)if(EXERCISES[i].id===id)return EXERCISES[i]}

/* ---------- nawigacja ---------- */
var cur="start";
function buildNav(){
  var h="";VIEWS.forEach(function(v){h+='<button class="nav-tab" data-view="'+v[0]+'"><span class="nav-ic">'+v[1]+'</span>'+v[2]+'</button>'});
  $("#navlist").innerHTML=h;
  $$(".nav-tab").forEach(function(b){b.onclick=function(){show(b.dataset.view,true);$("#rail").classList.remove("open")}});
}
function show(v,scroll){
  if(!document.getElementById("view-"+v))v="start";
  cur=v;$$(".view").forEach(function(e){e.hidden=e.id!=="view-"+v});
  $$(".nav-tab").forEach(function(b){b.classList.toggle("active",b.dataset.view===v)});
  st.last=v;saveSoon();
  try{history.replaceState(null,"","#"+v)}catch(e){}
  if(scroll)window.scrollTo(0,0);
  if(v==="zeszyt")renderNotebook();
  if(v==="wypracowanie")renderEssayMeta();
  document.title=(VIEWS.filter(function(x){return x[0]===v})[0]||[0,0,"Start"])[2]+" · Singelworth, zeszyt olimpijski";
}
function openItem(id){
  var v="start",sel=id;
  if(/^S[TBL]\d+$/.test(id)){v="atlas";resetAtlasFilter()}
  else if(/^A\d\.\d$/.test(id))v="cwiczenia";
  else if(/^T\d+$/.test(id))v="tezy";
  else if(/^P\d$/.test(id))v="zagadnienia";
  else if(/^[A-ZŁ]{1,2}$/.test(id)&&document.getElementById("src-"+id)){v="opracowania";sel="src-"+id}
  else if(VIEWS.some(function(x){return x[0]===id})){show(id,true);return}
  show(v,false);
  var el=document.getElementById(sel);
  if(el){if(el.classList.contains("card"))el.classList.add("open");setTimeout(function(){el.scrollIntoView({block:"start"});el.classList.add("flash");setTimeout(function(){el.classList.remove("flash")},1600)},30)}
}
document.addEventListener("click",function(e){
  var a=e.target.closest("[data-go]");
  if(a){e.preventDefault();openItem(a.dataset.go)}
});

/* ---------- START ---------- */
function renderStart(){
  var h='<h2 class="vt">Tajemnica lorda Singelworth</h2><p class="vsub">Zeszyt olimpijski do samodzielnej pracy: scena po scenie, z tezami, kontrargumentami i ćwiczeniami. OLiJP 2026/2027, temat: Cyprian Norwid.</p>';
  h+='<div class="panel q">Czy najważniejszą tajemnicą noweli jest zachowanie lorda, czy sposób, w jaki ludzie próbują je zrozumieć i ocenić?</div>';
  h+='<p class="read">To pytanie jest punktem wyjścia, nie odpowiedzią. Twoim zadaniem jest zbudować interpretację tekstu, który sam wywołuje konkurencyjne wyjaśnienia, i umieć wykazać, dlaczego jedna z nich jest mocniejsza.</p>';
  h+='<div class="stat" id="stats"></div>';
  h+='<h3>Jedna ścieżka pracy</h3><ol class="l"><li><b>Czytaj tekst sama.</b> Najpierw nowele (Wikiźródła), z własnymi notatkami. Potem opracowania.</li><li><b>Przejdź scenę po scenie</b> w zakładce Atlas. Przy każdej odpowiedz na pytanie i zapisz notatkę.</li><li><b>Sprawdzaj tezy</b> w zakładce Tezy: każda ma argument, kontrargument i granicę, czego tekst nie rozstrzyga.</li><li><b>Rób ćwiczenia</b> i pisz wypracowanie. Samodzielne rozumowanie jest ważniejsze niż liczba kart.</li></ol>';
  h+='<h3>Oznaczenia rygoru źródłowego</h3><div class="legend">'+["T","B","N","I","H"].map(function(c){return '<span>'+tagc(c)+({T:"przeczytane, stanowisko sprawdzone w tekście",B:"tylko bibliografia lub relacja z drugiej ręki",N:"brak lektury lub dostępu",I:"własna interpretacja, do obrony",H:"hipoteza do sprawdzenia"}[c])+'</span>'}).join("")+'</div>';
  h+='<div class="panel warn" style="margin-top:18px"><b>Ważne o tekście.</b> Strona odsyła do wydania z Wikiźródeł (Dzieła Cyprjana Norwida, wyd. Pini 1934). Komitet OLiJP wskazuje inne wydania (Gomulicki, Rzońca i Samsel). Pisownia i numeracja stron mogą się różnić; cytuj przez rozdział i fragment, a ważniejsze cytaty skonfrontuj z wydaniem Komitetu.</div>';
  h+='<div class="panel"><b>Czego ta strona jeszcze nie ma.</b> Nie czytałem Bachtina, Adamca, Dąbrowicz, Skalińskiej, Maciejewskiego, Łapińskiego, Łubieńskiego ani książki Rzepczyńskiego o nowelach włoskich. Przy tych pozycjach są oznaczenia [N] lub [B], a każda odwołująca się do nich teza jest hipotezą.</div>';
  h+='<div class="tools"><button class="btn" data-go="atlas">Zacznij od Atlasu scen</button><button class="btn alt" data-go="ST1">Scena 1: pytania zamiast opowieści</button><button class="btn alt" id="contBtn">Wróć do ostatniego miejsca</button></div>';
  $("#view-start").innerHTML=h;
  $("#contBtn").onclick=function(){show(st.last&&st.last!=="start"?st.last:"atlas",true)};
}
function updateProgress(){
  var s=SCENES.filter(function(x){return st.done[x.id]}).length,e=EXERCISES.filter(function(x){return st.done[x.id]}).length,w=words(st.essay.text);
  var el=$("#stats");
  if(el)el.innerHTML='<div class="s"><b>'+s+'/'+SCENES.length+'</b><span>scen przeczytanych</span></div><div class="s"><b>'+e+'/'+EXERCISES.length+'</b><span>ćwiczeń zrobionych</span></div><div class="s"><b>'+w+'</b><span>słów wypracowania ('+esc(st.essay.status)+')</span></div>';
  var p=$("#progBar"),pt=$("#progTxt");
  var tot=SCENES.length+EXERCISES.length,dn=s+e;
  if(p)p.style.width=Math.round(100*dn/tot)+"%";
  if(pt)pt.textContent=s+"/"+SCENES.length+" scen, "+e+"/"+EXERCISES.length+" ćwiczeń";
}

/* ---------- ATLAS ---------- */
var af={w:"",p:"",s:""};
function resetAtlasFilter(){af={w:"",p:"",s:""};renderAtlas()}
function sceneCard(sc){
  var W=WORKS[sc.w];
  var h='<article class="card" id="'+sc.id+'" data-w="'+sc.w+'" data-tags="'+sc.tags.join(" ")+'">';
  h+='<button class="ch" aria-expanded="false"><span class="badge st-'+sc.w+'">'+sc.id+'</span><span class="tt"><b>'+esc(sc.title)+'</b><small>'+esc(W.short)+' · '+esc(sc.loc)+' · '+sc.tags.join(", ")+'</small></span><span class="caret">▶</span></button>';
  h+='<div class="cb"><blockquote>'+esc(sc.quote)+'</blockquote><small class="status">'+esc(W.src)+'. Cytat z wydania Wikiźródeł.</small>';
  h+='<div class="lbl">Co jest w tekście '+tagc("T")+'</div><p>'+link(sc.fakt)+'</p>';
  h+='<div class="lbl">Narrator i wiedza</div><p>'+link(sc.narr)+'</p>';
  h+='<div class="lbl">Środki artystyczne</div><p>'+link(sc.means)+'</p>';
  h+='<div class="lbl">Znaczenie (wstępne) '+tagc("I")+'</div><p>'+mark(sc.znaczenie)+'</p>';

  h+='<div class="pc"><div class="pro"><b>Za</b>'+mark(sc.pro)+'</div><div class="con"><b>Przeciw / ograniczenia</b>'+mark(sc.con)+'</div></div>';
  if(sc.mn)h+='<div class="mn"><b>Twoje notatki.</b> '+mark(sc.mn)+'</div>';
  h+='<div class="lbl">Pytanie do Ciebie</div><p><b>'+esc(sc.q)+'</b></p>';
  h+='<div class="lbl">Powiązania</div><p>'+sc.tags.map(function(t){return '<a class="chip" href="#'+t+'" data-go="'+t+'">'+t+'</a>'}).join("")+(sc.th||[]).map(function(t){return '<a class="chip" href="#'+t+'" data-go="'+t+'">'+t+'</a>'}).join("")+'</p>';
  h+='<textarea class="n" data-note="'+sc.id+'" aria-label="Notatka do sceny '+sc.id+'" placeholder="Twoja odpowiedź na pytanie i notatki do tej sceny…"></textarea>';
  h+='<div class="tools"><label><input type="checkbox" data-done="'+sc.id+'"> Przeczytana i opracowana</label><button class="star" data-mark="'+sc.id+'" aria-pressed="false">☆ Zakładka</button></div>';
  h+='</div></article>';return h;
}
function renderAtlas(){
  var h='<h2 class="vt">Atlas scen</h2><p class="vsub">'+SCENES.length+' scen z trzech nowel: '+SCENES.filter(function(x){return x.w==="T"}).length+' z „Tajemnicy…”, '+SCENES.filter(function(x){return x.w==="B"}).length+' z „Bransoletki”, '+SCENES.filter(function(x){return x.w==="L"}).length+' z „Ad leones!”. Lokalizacja podana jest przez rozdział i numer strony druku Pini w nawiasie kwadratowym, tak jak na Wikiźródłach.</p>';
  h+='<div class="filters"><span class="lab">Utwór:</span>'+[["","Wszystkie"],["T","Tajemnica…"],["B","Bransoletka"],["L","Ad leones!"]].map(function(x){return '<button class="chip" data-aw="'+x[0]+'" aria-pressed="'+(af.w===x[0])+'">'+x[1]+'</button>'}).join("")+'</div>';
  h+='<div class="filters"><span class="lab">Zagadnienie:</span><button class="chip" data-ap="" aria-pressed="'+(af.p==="")+'">Wszystkie</button>'+PROBLEMS.map(function(p){return '<button class="chip" data-ap="'+p.id+'" aria-pressed="'+(af.p===p.id)+'">'+p.id+' '+esc(p.name)+'</button>'}).join("")+'</div>';
  h+='<div class="filters"><span class="lab">Stan:</span>'+[["","Wszystkie"],["todo","Do zrobienia"],["done","Przeczytane"],["mark","Zakładki"]].map(function(x){return '<button class="chip" data-as="'+x[0]+'" aria-pressed="'+(af.s===x[0])+'">'+x[1]+'</button>'}).join("")+'</div>';
  h+='<div class="status" id="acount"></div><div id="cards">'+SCENES.map(sceneCard).join("")+'</div>';
  $("#view-atlas").innerHTML=h;
  $$("#view-atlas [data-aw]").forEach(function(b){b.onclick=function(){af.w=b.dataset.aw;renderAtlas()}});
  $$("#view-atlas [data-ap]").forEach(function(b){b.onclick=function(){af.p=b.dataset.ap;renderAtlas()}});
  $$("#view-atlas [data-as]").forEach(function(b){b.onclick=function(){af.s=b.dataset.as;renderAtlas()}});
  wireCards($("#view-atlas"));applyAtlasFilter();
}
function applyAtlasFilter(){
  var n=0;
  $$("#cards .card").forEach(function(c){
    var id=c.id,ok=true;
    if(af.w&&c.dataset.w!==af.w)ok=false;
    if(af.p&&c.dataset.tags.split(" ").indexOf(af.p)<0)ok=false;
    if(af.s==="done"&&!st.done[id])ok=false;
    if(af.s==="todo"&&st.done[id])ok=false;
    if(af.s==="mark"&&!st.marks[id])ok=false;
    c.hidden=!ok;if(ok)n++;
  });
  var el=$("#acount");if(el)el.textContent="Widoczne: "+n+" z "+SCENES.length;
}
function wireCards(root){
  $$(".card>.ch",root).forEach(function(b){b.onclick=function(){var c=b.parentNode;c.classList.toggle("open");b.setAttribute("aria-expanded",c.classList.contains("open"))}});
  $$("[data-note]",root).forEach(function(t){t.value=st.notes[t.dataset.note]||"";t.oninput=function(){st.notes[t.dataset.note]=t.value;saveSoon()}});
  $$("[data-done]",root).forEach(function(c){c.checked=!!st.done[c.dataset.done];c.onchange=function(){st.done[c.dataset.done]=c.checked;if(!c.checked)delete st.done[c.dataset.done];save();if($("#view-atlas")&&!$("#view-atlas").hidden)applyAtlasFilter()}});
  $$("[data-mark]",root).forEach(function(b){function r(){var on=!!st.marks[b.dataset.mark];b.setAttribute("aria-pressed",on);b.textContent=(on?"★":"☆")+" Zakładka"}r();b.onclick=function(){if(st.marks[b.dataset.mark])delete st.marks[b.dataset.mark];else st.marks[b.dataset.mark]=true;save();r();if($("#view-atlas")&&!$("#view-atlas").hidden)applyAtlasFilter()}});
}

  PROBLEMS.forEach(function(p){
    h+='<article class="card" id="'+p.id+'"><button class="ch" aria-expanded="false"><span class="badge">'+p.id+'</span><span class="tt"><b>'+esc(p.name)+'</b><small>'+esc(p.off)+'</small></span><span class="caret">▶</span></button><div class="cb">';
    h+='<div class="lbl">Oficjalne sformułowanie</div><p>'+esc(p.off)+'</p>';

    h+='<div class="lbl">Pytania robocze</div><ul class="l">'+p.q.map(function(k){return '<li>'+mark(k)+'</li>'}).join("")+'</ul>';
    h+='<div class="lbl">Hipotezy do sprawdzenia</div><ul class="l">'+p.hyp.map(function(k){return '<li>'+mark(k)+'</li>'}).join("")+'</ul>';

function download(name,content,statusEl){

    var blob=new Blob([content],{type:"application/json"});var u=URL.createObjectURL(blob);var a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000);
    if(statusEl)statusEl.textContent="Przygotowano plik „"+name+"”. Jeśli pobieranie nie ruszyło, użyj przycisku „Kopiuj” i wklej treść do pliku.";
  }catch(e){if(statusEl)statusEl.textContent="Pobieranie nie działa w tej przeglądarce. Użyj „Kopiuj”."}
}
function copyText(txt,el){
  function fb(){var ta=document.createElement("textarea");ta.value=txt;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();if(el)el.textContent=ok?"Skopiowano.":"Nie udało się skopiować; zaznacz tekst ręcznie."}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){if(el)el.textContent="Skopiowano."},fb);else fb();
}

/* ---------- WYSZUKIWANIE ---------- */
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ł/g,"l")}
function search(q){
  q=norm(q.trim());if(!q)return[];
  var out=[];
  SCENES.forEach(function(s){var hay=norm([s.title,s.quote,s.fakt,s.narr,s.means,s.znaczenie,s.q].join(" "));if(hay.indexOf(q)>=0)out.push({id:s.id,t:s.id+" · "+s.title,k:"scena · "+WORKS[s.w].short+" · "+s.loc})});
  THESES.forEach(function(s){var hay=norm([s.text,s.pro,s.con,s.alt,s.limit].join(" "));if(hay.indexOf(q)>=0)out.push({id:s.id,t:s.id+" · "+s.text,k:"teza"})});
  EXERCISES.forEach(function(s){var hay=norm([s.title,s.task,s.hint].join(" "));if(hay.indexOf(q)>=0)out.push({id:s.id,t:s.id+" · "+s.title,k:"ćwiczenie"})});
  GLOSSARY.forEach(function(s){var hay=norm(s.t+" "+s.d);if(hay.indexOf(q)>=0)out.push({id:"pojecia",t:s.t,k:"pojęcie"})});
  PROBLEMS.forEach(function(s){var hay=norm([s.name,s.off,s.know.join(" ")].join(" "));if(hay.indexOf(q)>=0)out.push({id:s.id,t:s.id+" · "+s.name,k:"zagadnienie"})});
  SOURCES.forEach(function(s){var hay=norm(s.cite+" "+s.tezy.join(" "));if(hay.indexOf(q)>=0)out.push({id:s.id,t:s.cite,k:"opracowanie"})});
  return out;
}
function runSearch(){
  var q=$("#q").value;var v=$("#view-szukaj");
  if(!q.trim()){v.hidden=true;show(cur==="szukaj"?"start":cur,false);return}
  var res=search(q);
  $$(".view").forEach(function(e){e.hidden=true});v.hidden=false;
  v.innerHTML='<h2 class="vt">Wyniki wyszukiwania</h2><p class="vsub">„'+esc(q)+'”: '+res.length+' wyników.</p>'+(res.length?res.slice(0,60).map(function(r){return '<button class="res" data-go="'+esc(r.id)+'"><b>'+esc(r.t)+'</b><br><small>'+esc(r.k)+'</small></button>'}).join(""):'<p>Nic nie znaleziono. Spróbuj krótszego fragmentu albo słowa bez polskich znaków.</p>');
}

/* ---------- motyw, init ---------- */
function applyTheme(){var t=st.theme;if(!t){if(document.documentElement.getAttribute("data-theme"))return;t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}
function renderAll(){renderStart();renderAtlas();renderProblems();renderTheses();renderSources();renderExercises();renderGlossary();renderTopics();renderEssay();updateProgress()}
function init(){
  load();applyTheme();buildNav();renderAll();
  $("#themeBtn").onclick=function(){var t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";st.theme=t;applyTheme();save()};
  $("#menuBtn").onclick=function(){$("#rail").classList.toggle("open")};
  $("#q").addEventListener("input",runSearch);
  document.addEventListener("keydown",function(e){
    if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$("#q").focus()}
    if(e.key==="Escape"){if($("#q").value){$("#q").value="";runSearch()}$("#rail").classList.remove("open")}
  });
  var h=(location.hash||"").slice(1);
  if(h&&document.getElementById("view-"+h))show(h,false);
  else if(h)openItem(h);
  else show(st.last&&document.getElementById("view-"+st.last)?st.last:"start",false);
  if(!okStore)toast("Ta przeglądarka nie pozwala zapisywać danych. Notatki nie przetrwają zamknięcia.");
}
init();
})();

</script>
